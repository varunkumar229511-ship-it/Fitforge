<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitForge - BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">FitForge</div>
        <button class="menu-btn">☰</button>

        <nav>
            <a href="index.html">Home</a>
            <a href="workouts.html">Workouts</a>
            <a href="exercises.html">Exercises</a>
            <a href="bmi.html">BMI</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>


    <main class="bmi-background">

        <section class="page-title">
            <h1>BMI Calculator</h1>
            <p>Enter your details to calculate your BMI.</p>
        </section>


        <section class="bmi-section">

            <div class="bmi-card">

                <h2>Calculate Your BMI</h2>

                <label for="height">Height (cm)</label>
                <input type="number" id="height" placeholder="Enter height">

                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" placeholder="Enter weight">

                <button>Calculate BMI</button>

                <div id="bmi-result">
                    <h3>Your BMI</h3>
                    <p>Result will appear here.</p>
                </div>

            </div>

        </section>

    </main>


    <footer>
        <h2>FitForge</h2>
        <p>Build your strength. Build yourself.</p>
        <p>© 2026 FitForge. All Rights Reserved.</p>
    </footer>
     <script src="script.js"></script>
</body>
</html>
